services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valuebet
      POSTGRES_PASSWORD: valuebet
      POSTGRES_DB: valuebet
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuebet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://valuebet:valuebet@db:5432/valuebet
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Development override: mount source code and enable reload
  api-dev:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://valuebet:valuebet@db:5432/valuebet
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev

volumes:
  pgdata:
